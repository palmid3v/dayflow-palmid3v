name: DayFlow CI

on:
  push:
    branches: ["main", "feature/**", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      DAYFLOW_VALIDATE_EMAIL: ${{ secrets.DAYFLOW_VALIDATE_EMAIL }}
      DAYFLOW_VALIDATE_PASSWORD: ${{ secrets.DAYFLOW_VALIDATE_PASSWORD }}
      DAYFLOW_VALIDATE_URL: https://dayflow-palmid3v.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        if: ${{ env.DAYFLOW_VALIDATE_EMAIL != '' && env.DAYFLOW_VALIDATE_PASSWORD != '' }}
        run: npx playwright install --with-deps chromium

      - name: Static validation
        run: npm run validate:static

      - name: CVP and production E2E
        if: ${{ env.DAYFLOW_VALIDATE_EMAIL != '' && env.DAYFLOW_VALIDATE_PASSWORD != '' }}
        run: npm run validate

      - name: E2E configuration notice
        if: ${{ env.DAYFLOW_VALIDATE_EMAIL == '' || env.DAYFLOW_VALIDATE_PASSWORD == '' }}
        run: echo "Full CVP/E2E validation skipped because DAYFLOW_VALIDATE_EMAIL/DAYFLOW_VALIDATE_PASSWORD GitHub secrets are not configured."
